<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prasanta Engineering & Contractor - Attendance System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <div class="max-w-md mx-auto bg-white shadow-lg min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-blue-900 text-white p-4 text-center">
            <h1 class="text-xl font-bold">Prasanta Engineering & Contractor</h1>
            <p class="text-xs text-blue-200 mt-1">Cloud Attendance System</p>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-gray-200 bg-gray-50">
            <button onclick="switchTab('employee')" id="tab-employee" class="flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600">Employee View</button>
            <button onclick="switchTab('owner')" id="tab-owner" class="flex-1 py-3 text-center font-medium text-gray-500">Owner Dashboard</button>
        </div>

        <!-- Main Content Area -->
        <main class="p-4 flex-1">
            <!-- Employee Section -->
            <div id="section-employee" class="space-y-4">
                <h2 class="text-lg font-semibold text-gray-800">Mark Attendance</h2>
                <form id="attendance-form" class="space-y-3" onsubmit="markAttendance(event)">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Employee Name</label>
                        <input type="text" id="emp-name" required placeholder="Enter your full name" class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Select Status</label>
                        <select id="emp-status" class="mt-1 w-full p-2 border border-gray-300 rounded-md">
                            <option value="Present">Present</option>
                            <option value="Half-Day">Half-Day</option>
                            <option value="Absent">Absent</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">Submit Attendance</button>
                </form>
                <div id="employee-msg" class="text-sm text-center mt-2"></div>
            </div>

            <!-- Owner Section -->
            <div id="section-owner" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-800">Live Attendance Records</h2>
                    <button onclick="loadAttendanceRecords()" class="text-xs bg-gray-200 px-3 py-1 rounded hover:bg-gray-300">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b text-xs text-gray-600">
                                <th class="p-2">Name</th>
                                <th class="p-2">Status</th>
                                <th class="p-2">Time</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-table-body" class="text-sm">
                            <tr>
                                <td colspan="3" class="p-4 text-center text-gray-500">Loading records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK Scripts (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Exact Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBCj4EEYDKbtuBtdHsHEssW3zHcLAv0CRA",
          authDomain: "prasanta-attendance-system.firebaseapp.com",
          projectId: "prasanta-attendance-system",
          storageBucket: "prasanta-attendance-system.firebasestorage.app",
          messagingSenderId: "265672524321",
          appId: "1:265672524321:web:7f656a0db2b127db6e1960",
          measurementId: "G-624KWXRXV0"
        };

        // Initialize Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Make db globally available for form submission & fetching
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.orderBy = orderBy;

        // Initial fetch for owner view if opened
        loadAttendanceRecords();
    </script>

    <!-- App Logic Script -->
    <script>
        function switchTab(role) {
            const empTab = document.getElementById('tab-employee');
            const ownerTab = document.getElementById('tab-owner');
            const empSection = document.getElementById('section-employee');
            const ownerSection = document.getElementById('section-owner');

            if (role === 'employee') {
                empTab.className = "flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600";
                ownerTab.className = "flex-1 py-3 text-center font-medium text-gray-500";
                empSection.classList.remove('hidden');
                ownerSection.classList.add('hidden');
            } else {
                ownerTab.className = "flex-1 py-3 text-center font-medium text-blue-600 border-b-2 border-blue-600";
                empTab.className = "flex-1 py-3 text-center font-medium text-gray-500";
                ownerSection.classList.remove('hidden');
                empSection.classList.add('hidden');
                loadAttendanceRecords();
            }
        }

        async function markAttendance(event) {
            event.preventDefault();
            const name = document.getElementById('emp-name').value;
            const status = document.getElementById('emp-status').value;
            const msgDiv = document.getElementById('employee-msg');

            if (!window.db) {
                msgDiv.innerHTML = "<span class='text-red-600'>Firebase is initializing, please wait a second.</span>";
                return;
            }

            try {
                msgDiv.innerHTML = "<span class='text-blue-600'>Saving attendance...</span>";
                await window.addDoc(window.collection(window.db, "attendance"), {
                    name: name,
                    status: status,
                    timestamp: new Date().toLocaleString()
                });
                msgDiv.innerHTML = "<span class='text-green-600 font-medium'>Attendance marked successfully!</span>";
                document.getElementById('attendance-form').reset();
            } catch (error) {
                console.error("Error adding document: ", error);
                msgDiv.innerHTML = "<span class='text-red-600'>Error saving attendance. Try again.</span>";
            }
        }

        async function loadAttendanceRecords() {
            const tableBody = document.getElementById('attendance-table-body');
            if (!window.db) return;

            tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">Loading records...</td></tr>`;

            try {
                const q = window.query(window.collection(window.db, "attendance"));
                const querySnapshot = await window.getDocs(q);
                
                if (querySnapshot.empty) {
                    tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-500">No attendance records found.</td></tr>`;
                    return;
                }

                let rows = '';
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let badgeColor = data.status === 'Present' ? 'bg-green-100 text-green-800' : (data.status === 'Half-Day' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
                    rows += `
                        <tr class="border-b">
                            <td class="p-2 font-medium text-gray-800">${data.name}</td>
                            <td class="p-2"><span class="px-2 py-1 rounded text-xs font-semibold ${badgeColor}">${data.status}</span></td>
                            <td class="p-2 text-xs text-gray-500">${data.timestamp}</td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = rows;
            } catch (error) {
                console.error("Error loading documents: ", error);
                tableBody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-red-500">Failed to load records.</td></tr>`;
            }
        }
    </script>
</body>
</html>
