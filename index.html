<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Email OTP App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // EmailJS Initialization with Public Key
        emailjs.init("dx_EZ5roIzsVPTokP");
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isVerified, setIsVerified] = React.useState(false);
            const [step, setStep] = React.useState('login');
            const [email, setEmail] = React.useState('');
            const [generatedOtp, setGeneratedOtp] = React.useState('');
            const [enteredOtp, setEnteredOtp] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleSendOtp = (e) => {
                e.preventDefault();
                if (!email || !email.includes('@')) {
                    setError('Daya kari gote satha email address diantu.');
                    return;
                }
                
                setError('');
                setLoading(true);

                const mockOtp = Math.floor(1000 + Math.random() * 9000).toString();
                setGeneratedOtp(mockOtp);

                // EmailJS Parameters matching template placeholders
                const templateParams = {
                    email: email, 
                    otp: mockOtp  
                };

                emailjs.send("service_33ql72e", "template_qs9fv3s", templateParams)
                    .then((response) => {
                        setLoading(false);
                        setStep('otp');
                    }, (err) => {
                        setLoading(false);
                        setError('Email pathae belare samasya hela. Purnibara chesta karantu.');
                        console.error('FAILED...', err);
                    });
            };

            const handleVerifyOtp = (e) => {
                e.preventDefault();
                if (enteredOtp !== generatedOtp) {
                    setError('Bhul OTP! Apananka email inbox check karantu.');
                    return;
                }
                setError('');
                setIsVerified(true);
            };

            if (!isVerified) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col justify-center items-center p-4">
                        {step === 'login' ? (
                            <div className="max-w-md w-full bg-white rounded-xl shadow-md p-8 border border-slate-100">
                                <h1 className="text-2xl font-bold text-slate-800 text-center mb-2">Email Verification</h1>
                                <p className="text-sm text-slate-500 text-center mb-6">Real OTP apananka email ku asiba</p>
                                {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg">{error}</div>}
                                <form onSubmit={handleSendOtp} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                                        <input 
                                            type="email" 
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            placeholder="name@example.com" 
                                            className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                            required
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        disabled={loading}
                                        className="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 disabled:bg-blue-300"
                                    >
                                        {loading ? 'Sending Real OTP...' : 'Send Real OTP'}
                                    </button>
                                </form>
                            </div>
                        ) : (
                            <div className="max-w-md w-full bg-white rounded-xl shadow-md p-8 border border-slate-100">
                                <h1 className="text-2xl font-bold text-slate-800 text-center mb-2">Enter OTP</h1>
                                <p className="text-sm text-slate-500 text-center mb-6">OTP code sent to {email}</p>
                                {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg">{error}</div>}
                                <form onSubmit={handleVerifyOtp} className="space-y-4">
                                    <input 
                                        type="text" 
                                        maxLength="4"
                                        value={enteredOtp}
                                        onChange={(e) => setEnteredOtp(e.target.value)}
                                        placeholder="1234" 
                                        className="w-full text-center tracking-widest text-2xl font-mono px-4 py-3 border border-slate-300 rounded-lg focus:outline-none"
                                        required
                                    />
                                    <button type="submit" className="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700">
                                        Verify OTP & Open App
                                    </button>
                                    <button type="button" onClick={() => setStep('login')} className="w-full text-sm text-slate-500 pt-2">
                                        ← Back
                                    </button>
                                </form>
                            </div>
                        )}
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 p-8">
                    <div className="max-w-4xl mx-auto bg-white rounded-xl shadow p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h1 className="text-2xl font-bold text-slate-800">🎉 Welcome to Main App!</h1>
                            <button 
                                onClick={() => { setIsVerified(false); setStep('login'); setEmail(''); setEnteredOtp(''); }}
                                className="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100"
                            >
                                Log Out
                            </button>
                        </div>
                        <p className="text-slate-600">Apana successful real email verify kari app bhitare enter karichanti ({email}).</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
