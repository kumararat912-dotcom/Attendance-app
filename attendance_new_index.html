<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi-Company Attendance Management — ₹0 Spark</title>
<style>
:root{--bg:#fff;--panel:#f7f9fc;--ink:#182230;--navy:#1d3557;--blue:#2a6f97;--green:#2a9d8f;--red:#e63946;--amber:#d98e2b;--border:#dfe5ec}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body.dark{--bg:#121212;--panel:#1e1e1e;--ink:#eee;--border:#333}.app{width:100%;max-width:900px;margin:auto;min-height:100vh;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}.brand{font-weight:800}.sub{font-size:11px;opacity:.8}
main{padding:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
h2,h3{margin:0 0 12px;color:var(--navy)}body.dark h2,body.dark h3{color:#90caf9}
input,select{width:100%;padding:11px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--ink);margin:6px 0 12px}label{font-size:12px;font-weight:700}
button{width:100%;padding:10px;border:0;border-radius:7px;background:var(--navy);color:#fff;font-weight:700;margin:4px 0;cursor:pointer}button.secondary{background:var(--amber)}button.success{background:var(--green)}button.danger{background:var(--red)}button.blue{background:var(--blue)}button.small{width:auto;padding:7px 10px;font-size:12px}
.hidden{display:none!important}.muted{font-size:12px;color:#777}.msg{padding:10px;border-radius:7px;background:#eaf3ff;margin:10px 0;font-size:13px}.error{color:#b91c1c;background:#fff1f2}.ok{color:#166534;background:#f0fdf4}
.stats{font-size:27px;font-weight:800}.emp{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin:7px 0;background:var(--bg)}.grow{flex:1}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:800}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:42px;border-radius:5px;background:#e5e7eb;color:#222;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.head{background:transparent;color:var(--ink);min-height:25px}.present{background:var(--green);color:#fff}.partial{background:var(--amber);color:#fff}.absent{background:var(--red);color:#fff}.leave{background:#2563eb;color:#fff}.future{background:var(--panel);border:1px solid var(--border);color:#aaa}.late{outline:3px solid #f97316}.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.legend span{padding:5px 8px;border-radius:6px;font-size:11px;font-weight:700}.legend .lg-present{background:var(--green);color:#fff}.legend .lg-absent{background:var(--red);color:#fff}.legend .lg-leave{background:#2563eb;color:#fff}.legend .lg-half{background:var(--amber);color:#fff}.legend .lg-late{background:#f97316;color:#fff}
.camera{height:260px;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:8px 0}.camera video,.camera img{width:100%;height:100%;object-fit:cover}.camera span{color:#aaa}.photo{max-width:100%;max-height:180px;border-radius:8px;object-fit:cover}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:30}.modal>div{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--panel);border-radius:10px;padding:18px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header><div><div id="brand" class="brand">SaaS Attendance Portal</div><div id="sub" class="sub">Firebase Authentication + Firestore • ₹0 Spark</div></div><button id="logout" class="small hidden" onclick="logout()">Logout</button></header>
<main id="main"></main>
</div>
<div id="modal" class="modal hidden"><div><button class="small" style="float:right;width:auto" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>

<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendEmailVerification,sendPasswordResetEmail,updateProfile}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,onSnapshot,serverTimestamp,query,where,getDocs,orderBy,limit,deleteField}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyBCj4EEYDKbtuBtdHsHEssW3zHcLAv0CRA",authDomain:"prasanta-attendance-system.firebaseapp.com",projectId:"prasanta-attendance-system",storageBucket:"prasanta-attendance-system.firebasestorage.app",messagingSenderId:"265672524321",appId:"1:265672524321:web:7f656a0db2b127db6e1960",measurementId:"G-624KWXRXV0"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let state={user:null,role:null,company:null,employee:null,employees:[],todayAttendance:{},unsub:null,stream:null};
const iso=()=>new Date().toISOString().slice(0,10);
const SELFIE_RETENTION_DAYS=90;
const selfieExpired=(dateKey)=>{const d=new Date(dateKey+"T00:00:00Z"); const cutoff=new Date(); cutoff.setUTCDate(cutoff.getUTCDate()-SELFIE_RETENTION_DAYS); return d<new Date(cutoff.toISOString().slice(0,10)+"T00:00:00Z")};
async function purgeExpiredSelfies(employeeId, docs){
  const jobs=[];
  for(const d of docs){
    if(!selfieExpired(d.id)) continue;
    const data=d.data();
    const patch={};
    if(data.checkInSelfie) patch.checkInSelfie=deleteField();
    if(data.checkOutSelfie) patch.checkOutSelfie=deleteField();
    if(Object.keys(patch).length) jobs.push(updateDoc(doc(db,"employees",employeeId,"attendance",d.id),patch));
  }
  if(jobs.length) await Promise.allSettled(jobs);
}
const attendanceRef=(employeeId,dateKey)=>doc(db,"employees",employeeId,"attendance",dateKey);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function stopCamera(){if(state.stream){state.stream.getTracks().forEach(x=>x.stop());state.stream=null}}
function setMain(h){stopCamera();$("main").innerHTML=h}
function closeModal(){ $("modal").classList.add("hidden");$("modalBody").innerHTML="" }
window.closeModal=closeModal;
function openModal(h){$("modalBody").innerHTML=h;$("modal").classList.remove("hidden")}
function alertErr(e){alert(e?.message||"Something went wrong.")}
function todayRecord(e){return state.todayAttendance?.[e.id]||{}}
async function loadTodayAttendance(){
  const key=iso();
  const entries=await Promise.all(state.employees.map(async e=>{
    try{const s=await getDoc(attendanceRef(e.id,key));return [e.id,s.exists()?s.data():{}]}catch(_){return [e.id,{}]}}));
  state.todayAttendance=Object.fromEntries(entries);
  renderOwnerStats();
}
function renderOwnerStats(){
  if(!$('count'))return;
  let present=0,records=0;
  state.employees.forEach(e=>{const r=todayRecord(e);if(r.checkIn)present++;if(r.checkIn||r.checkOut)records++});
  $('count').textContent=state.employees.length;
  $('present').textContent=present;
  $('records').textContent=records;
}
function brand(){if(state.company){$("brand").textContent=state.company.name||"Company";$("sub").textContent="Attendance Management System";document.body.classList.toggle("dark",!!state.company.darkMode)}else{ $("brand").textContent="SaaS Attendance Portal";$("sub").textContent="Firebase Authentication + Firestore • ₹0 Spark";document.body.classList.remove("dark")}}
async function logout(){stopCamera();if(state.unsub)state.unsub();await signOut(auth);location.reload()} window.logout=logout;

function welcome(){brand();$("logout").classList.add("hidden");setMain(`<div class="card" style="text-align:center;padding:35px 18px"><h2>Welcome</h2><p class="muted">Choose your portal</p><button onclick="ownerLogin()">Company Owner Login</button><button class="secondary" onclick="register()">Register New Company</button><button class="blue" onclick="employeeLogin()">Employee Portal</button></div>`)}
window.ownerLogin=()=>setMain(`<div class="card"><h3>Company Owner Login</h3><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><button onclick="doOwnerLogin()">Login</button><button class="secondary" onclick="resetPassword()">Forgot Password</button><button class="danger" onclick="welcome()">Back</button></div>`);
window.employeeLogin=()=>setMain(`<div class="card"><h3>Employee Login</h3><label>Email</label><input id="email" type="email"><label>Password</label><input id="pass" type="password"><button class="blue" onclick="doEmployeeLogin()">Login</button><button class="secondary" onclick="resetPassword()">Forgot Password</button><button class="danger" onclick="welcome()">Back</button></div>`);
window.resetPassword=async()=>{let e=prompt("Registered email:")?.trim().toLowerCase();if(!e)return;try{await sendPasswordResetEmail(auth,e);alert("Password reset email sent.")}catch(x){alertErr(x)}};
window.doOwnerLogin=async()=>{try{let r=await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase(),$("pass").value);if(!r.user.emailVerified){await signOut(auth);throw Error("Please verify your email first.")}}catch(e){alertErr(e)}};
window.doEmployeeLogin=async()=>{try{let r=await signInWithEmailAndPassword(auth,$("email").value.trim().toLowerCase(),$("pass").value);if(!r.user.emailVerified){await signOut(auth);throw Error("Please verify your email first.")}let s=await getDoc(doc(db,"employees",r.user.uid));if(!s.exists()||s.data().active===false){await signOut(auth);throw Error("Employee profile not found or deactivated.")}state.employee={id:s.id,...s.data()};state.role="employee";await loadCompany(state.employee.companyId);employeeDash()}catch(e){alertErr(e)}};

window.register=()=>setMain(`<div class="card"><h3>Register Company</h3><label>Company name</label><input id="cn"><label>Owner name</label><input id="on"><label>Email</label><input id="email" type="email"><label>Password (minimum 6)</label><input id="pass" type="password"><button onclick="doRegister()">Create Company</button><p class="muted">A verification email will be sent by Firebase Authentication.</p><button class="secondary" onclick="welcome()">Back</button></div>`);
window.doRegister=async()=>{try{let n=$("cn").value.trim(),on=$("on").value.trim(),e=$("email").value.trim().toLowerCase(),p=$("pass").value;if(!n||!on||!e||p.length<6)throw Error("Fill all fields; password must be at least 6 characters.");let r=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(r.user,{displayName:on});await setDoc(doc(db,"companies",r.user.uid),{ownerUid:r.user.uid,name:n,ownerName:on,email:e,darkMode:false,createdAt:serverTimestamp()});await sendEmailVerification(r.user);await signOut(auth);alert("Company created. Verify your email, then login.");welcome()}catch(e){alertErr(e)}};

async function loadCompany(id){let s=await getDoc(doc(db,"companies",id));if(!s.exists())throw Error("Company profile not found.");state.company={id:s.id,...s.data()};brand()}
async function ownerData(){let s=await getDoc(doc(db,"companies",auth.currentUser.uid));if(!s.exists())throw Error("Company profile not found.");state.company={id:s.id,...s.data()};state.role="owner";brand();subscribeEmployees();ownerDash()}
function subscribeEmployees(){if(state.unsub)state.unsub();state.unsub=onSnapshot(query(collection(db,"employees"),where("companyId","==",state.company.id)),s=>{state.employees=s.docs.map(d=>({id:d.id,...d.data()}));renderOwner();loadTodayAttendance().catch(()=>{})})}

function ownerDash(){setMain(`<div class="row"><h2 style="flex:1">Company Dashboard</h2><button class="small secondary" onclick="companySettings()">Settings</button></div><div class="grid"><div class="card"><div class="muted">Employees</div><div id="count" class="stats">0</div></div><div class="card"><div class="muted">Present today</div><div id="present" class="stats">0</div></div><div class="card"><div class="muted">Attendance records</div><div id="records" class="stats">0</div></div></div><div class="row"><button onclick="showOwnerHome()">Employees</button><button class="secondary" onclick="showAddEmployee()">Add Employee</button><button class="blue" onclick="exportCSV()">Monthly CSV</button><button class="secondary" onclick="leaveRequests()">Leave Requests</button></div><div id="ownerPanel" class="card"></div><p class="muted">Spark-safe design: attendance is stored one document per employee per date; selfies are compressed before Firestore upload and retained for 90 days.</p>`);renderOwner()}
function renderOwner(){let p=$("ownerPanel");if(!p)return;renderOwnerStats();p.innerHTML=`<h3>Employees</h3><input id="search" placeholder="Search name / email / ID"><div id="elist"></div>`;drawEmployees();$("search").oninput=drawEmployees}
window.showOwnerHome=ownerDash;
function drawEmployees(){let q=($("search")?.value||"").toLowerCase(),a=state.employees.filter(e=>(e.name+" "+e.email+" "+e.employeeId+" "+e.position).toLowerCase().includes(q));$("elist").innerHTML=a.map(e=>{let r=todayRecord(e);return `<div class="emp"><div class="avatar">${esc((e.name||"?")[0].toUpperCase())}</div><div class="grow"><b>${esc(e.name)}</b><br><small>${esc(e.employeeId||"")} · ${esc(e.position||"")}<br>${esc(e.email||"")}</small></div><button class="small" onclick="viewEmployee('${esc(e.id)}')">View</button></div>`}).join("")||"<p class='muted'>No employees.</p>"}

window.showAddEmployee=()=>{$("ownerPanel").innerHTML=`<h3>Add Employee</h3><div class="grid"><div><label>Full name *</label><input id="en"></div><div><label>Email *</label><input id="ee" type="email"></div><div><label>Temporary password *</label><input id="ep" type="password"></div><div><label>Employee ID *</label><input id="ecode"></div><div><label>Position</label><input id="pos"></div><div><label>Salary</label><input id="salary" type="number" min="0"></div><div><label>DOB</label><input id="dob" type="date"></div><div><label>Joining date</label><input id="join" type="date"></div><div><label>Aadhaar last 4 only</label><input id="aad" maxlength="4" inputmode="numeric"></div><div><label>Duty hours/day</label><input id="hours" type="number" min="1" max="24" value="8"></div></div><button class="success" onclick="createEmployee()">Create Employee</button><button class="secondary" onclick="ownerDash()">Cancel</button><p class="muted">No Firebase Storage is used. Employee photo/selfie is optional and can be stored as a small compressed Firestore image, subject to Firestore quotas.</p>`};
async function createEmployee(){
  let n=$("en").value.trim(),e=$("ee").value.trim().toLowerCase(),p=$("ep").value,code=$("ecode").value.trim()||"EMP-"+Math.floor(100000+Math.random()*900000),pos=$("pos").value.trim(),aad=$("aad").value.replace(/\D/g,"").slice(-4);
  if(!n||!e||p.length<6||!code) return alert("Name, email, password and employee ID are required.");
  if(aad&&aad.length!==4)return alert("Aadhaar must contain only the last 4 digits.");
  if(state.employees.some(x=>x.email===e||x.employeeId===code))return alert("Employee email or ID already exists.");
  let secondary;
  try{
    secondary=initializeApp(cfg,"employeeCreator_"+Date.now());let a2=getAuth(secondary);
    let r=await createUserWithEmailAndPassword(a2,e,p);await updateProfile(r.user,{displayName:n});await sendEmailVerification(r.user);
    await setDoc(doc(db,"employees",r.user.uid),{uid:r.user.uid,companyId:auth.currentUser.uid,active:true,name:n,email:e,employeeId:code,position:pos,salary:Number($("salary").value)||0,dob:$("dob").value,joining:$("join").value,aadhaarLast4:aad,dutyHours:Number($("hours").value)||8,createdAt:serverTimestamp()});
    await signOut(a2);alert("Employee created. Give the employee the temporary password and ask them to verify their email.");ownerDash();
  }catch(x){alertErr(x)}finally{if(secondary)try{await deleteApp(secondary)}catch(_){}}
}

window.viewEmployee=async id=>{let e=state.employees.find(x=>x.id===id);if(!e)return;openModal(`<h3>${esc(e.name)}</h3><p><b>ID:</b> ${esc(e.employeeId)}</p><p><b>Email:</b> ${esc(e.email)}</p><p><b>Position:</b> ${esc(e.position)}</p><p><b>Salary:</b> ₹${Number(e.salary||0).toLocaleString()}</p><p><b>Duty:</b> ${e.dutyHours||8} hours/day</p><p><b>DOB:</b> ${esc(e.dob||"—")}</p><p><b>Joining:</b> ${esc(e.joining||"—")}</p><p><b>Aadhaar:</b> ****${esc(e.aadhaarLast4||"")}</p><button class="blue" onclick="employeeCalendar('${esc(e.id)}')">Attendance Calendar</button><button class="secondary" onclick="deactivateEmployee('${esc(e.id)}')">${e.active===false?"Activate":"Deactivate"} Employee</button>`)}
window.deactivateEmployee=async id=>{let e=state.employees.find(x=>x.id===id);if(!e)return;let next=e.active===false; if(!confirm(next?"Activate this employee?":"Deactivate this employee?"))return;try{await updateDoc(doc(db,"employees",id),{active:next,updatedAt:serverTimestamp()});closeModal()}catch(x){alertErr(x)}}
window.employeeCalendar=async id=>{
  const e=state.employees.find(x=>x.id===id);if(!e)return;
  openModal(`<h3>${esc(e.name)} — Attendance</h3><div id="cal"><p class="muted">Loading attendance…</p></div>`);
  try{const [snap,lsnap]=await Promise.all([getDocs(collection(db,"employees",id,"attendance")),getDocs(collection(db,"employees",id,"leaveRequests"))]);await purgeExpiredSelfies(id,snap.docs);const records=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));const leaveMap=Object.fromEntries(lsnap.docs.filter(d=>d.data().status==="approved").map(d=>[d.data().date,d.data()]));drawCalendar($("cal"),e,records,leaveMap)}
  catch(x){$("cal").innerHTML=`<p class="error">${esc(x.message)}</p>`}
};
async function drawCalendar(el,e,records,leaveMap={}){
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  let h=`<div class="legend"><span class="lg-present">Present</span><span class="lg-absent">Absent</span><span class="lg-leave">Approved Leave</span><span class="lg-half">Half Day</span><span class="lg-late">Late</span></div><div class="calendar">${["Su","Mo","Tu","We","Th","Fr","Sa"].map(x=>`<div class="day head">${x}</div>`).join("")}`;
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let n=1;n<=days;n++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`,r=records?.[k]||{},lv=leaveMap?.[k],future=new Date(k)>new Date(iso());let cls=future?"future":(lv?.status==="approved"?"leave":(r.checkIn&&r.checkOut?"present":r.checkIn?"partial":"absent"));if(r.checkIn&&r.checkInTimestamp){const hr=new Date(r.checkInTimestamp).getHours()+new Date(r.checkInTimestamp).getMinutes()/60;if(hr>10)cls+=" late"}h+=`<div class="day ${cls}" onclick="attendanceDetail('${esc(e.id)}','${k}')">${n}</div>`}
  el.innerHTML=h+"</div>";
}
window.attendanceDetail=async(id,k)=>{
  const e=state.role==="owner"?state.employees.find(x=>x.id===id):state.employee;if(!e)return;
  openModal(`<h3>${k}</h3><p class="muted">Loading…</p>`);
  try{const [s,ls]=await Promise.all([getDoc(attendanceRef(e.id,k)),getDocs(query(collection(db,"employees",e.id,"leaveRequests"),where("date","==",k)))]);let r=s.exists()?s.data():null;const leaves=ls.docs.map(d=>d.data());const lv=leaves.find(x=>x.status==="approved")||leaves[0];if(r&&selfieExpired(k))r={...r,checkInSelfie:null,checkOutSelfie:null};
    openModal(`<h3>${k}</h3>${lv?`<p><b>Leave:</b> ${esc(lv.type||"Leave")} — <b>${esc(lv.status||"pending")}</b><br><b>Reason:</b> ${esc(lv.reason||"—")}</p>`:""}${r?`<p>Check-in: ${esc(r.checkIn||"—")}<br>Check-out: ${esc(r.checkOut||"—")}<br>Hours: ${esc(r.hoursWorked??"—")}<br>Check-in location: ${esc(JSON.stringify(r.checkInLocation||"—"))}<br>Check-out location: ${esc(JSON.stringify(r.checkOutLocation||"—"))}</p>${r.checkInSelfie?`<img class="photo" src="${esc(r.checkInSelfie)}">`:""}${r.checkOutSelfie?`<img class="photo" src="${esc(r.checkOutSelfie)}">`:""}`:"<p>No attendance record.</p>"}`)
  }catch(x){openModal(`<h3>${k}</h3><p class="error">${esc(x.message)}</p>`)}
};
window.companySettings=()=>openModal(`<h3>Company Settings</h3><p><b>${esc(state.company.name)}</b><br>${esc(state.company.email)}</p><button onclick="toggleDark()">Toggle Dark Mode</button><button class="secondary" onclick="renameCompany()">Change Company Name</button><p class="muted"><b>Selfie retention:</b> 90 days. Older check-in/check-out photos are removed while attendance records remain.</p><p class="muted">Company deletion is intentionally disabled in this Spark-only client because deleting every Auth account securely requires Admin SDK/server code.</p>`);
window.toggleDark=async()=>{try{let v=!state.company.darkMode;await updateDoc(doc(db,"companies",state.company.id),{darkMode:v});state.company.darkMode=v;brand();closeModal()}catch(e){alertErr(e)}};
window.renameCompany=async()=>{let n=prompt("New company name:",state.company.name)?.trim();if(!n)return;try{await updateDoc(doc(db,"companies",state.company.id),{name:n});state.company.name=n;brand();closeModal()}catch(e){alertErr(e)}};

function employeeDash(){$("logout").classList.remove("hidden");setMain(`<div class="row"><h2 style="flex:1">Employee Portal</h2></div><div class="grid"><div class="card"><div class="muted">Employee</div><h3>${esc(state.employee.name)}</h3><p>${esc(state.employee.employeeId)} · ${esc(state.employee.position)}</p></div><div class="card"><div class="muted">Salary</div><div class="stats">₹${Number(state.employee.salary||0).toLocaleString()}</div></div></div><div class="row"><button onclick="empProfile()">Profile</button><button class="secondary" onclick="empAttendance()">Today's Attendance</button><button class="blue" onclick="empHistory()">Calendar</button><button class="secondary" onclick="applyLeave()">Apply Leave</button><button onclick="empSalary()">Salary</button></div><div id="empPanel" class="card"></div>`);empProfile()}
window.applyLeave=()=>{const min=iso();$("empPanel").innerHTML=`<h3>Apply Leave</h3><label>Date</label><input id="ldate" type="date" min="${min}"><label>Leave type</label><select id="ltype"><option>Casual Leave</option><option>Sick Leave</option><option>Emergency Leave</option><option>Unpaid Leave</option></select><label>Reason</label><input id="lreason" maxlength="250" placeholder="Reason for leave"><button class="success" onclick="submitLeave()">Submit Leave Request</button><div id="myLeaves" class="card"><p class="muted">Loading requests…</p></div>`;loadMyLeaves()};
window.submitLeave=async()=>{try{const date=$("ldate").value;if(!date)throw Error("Select a leave date.");if(date<iso())throw Error("Past dates cannot be requested.");const existing=await getDocs(query(collection(db,"employees",state.user.uid,"leaveRequests"),where("date","==",date)));if(existing.docs.some(x=>x.data().status==="pending"||x.data().status==="approved"))throw Error("A leave request already exists for this date.");await setDoc(doc(collection(db,"employees",state.user.uid,"leaveRequests")),{employeeUid:state.user.uid,companyId:state.employee.companyId,date,type:$("ltype").value,reason:$("lreason").value.trim(),status:"pending",createdAt:serverTimestamp(),updatedAt:serverTimestamp()});alert("Leave request submitted.");loadMyLeaves()}catch(e){alertErr(e)}};
async function loadMyLeaves(){try{const s=await getDocs(query(collection(db,"employees",state.user.uid,"leaveRequests"),orderBy("date","desc"),limit(50)));$("myLeaves").innerHTML=`<h4>My Leave Requests</h4>`+(s.empty?`<p class="muted">No requests.</p>`:s.docs.map(d=>{const x=d.data();return `<div class="emp"><div class="grow"><b>${esc(x.date)}</b> · ${esc(x.type)}<br><span class="muted">${esc(x.reason||"")} · ${esc(x.status)}</span></div></div>`}).join(""))}catch(e){if($("myLeaves"))$("myLeaves").innerHTML=`<p class="error">${esc(e.message)}</p>`}}
window.leaveRequests=async()=>{openModal(`<h3>Leave Requests</h3><div id="leaveList">Loading…</div>`);try{const all=[];for(const e of state.employees){const s=await getDocs(query(collection(db,"employees",e.id,"leaveRequests"),where("status","==","pending")));s.docs.forEach(d=>all.push({id:d.id,e,ref:d.ref,x:d.data()}))}$("leaveList").innerHTML=all.length?all.map(a=>`<div class="emp"><div class="grow"><b>${esc(a.e.name)}</b> — ${esc(a.x.date)}<br>${esc(a.x.type)} · ${esc(a.x.reason||"")}</div><button class="success small" onclick="decideLeave('${esc(a.e.id)}','${esc(a.id)}','approved')">Approve</button><button class="danger small" onclick="decideLeave('${esc(a.e.id)}','${esc(a.id)}','rejected')">Reject</button></div>`).join(""):`<p class="muted">No pending leave requests.</p>`}catch(e){$("leaveList").innerHTML=`<p class="error">${esc(e.message)}</p>`}};
window.decideLeave=async(eid,rid,status)=>{try{await updateDoc(doc(db,"employees",eid,"leaveRequests",rid),{status,decidedAt:serverTimestamp(),updatedAt:serverTimestamp()});await leaveRequests()}catch(e){alertErr(e)}};
window.empSalary=async()=>{try{const d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),snap=await getDocs(collection(db,"employees",state.user.uid,"attendance")),ls=await getDocs(collection(db,"employees",state.user.uid,"leaveRequests"));const rec=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()])),leaves=Object.fromEntries(ls.docs.map(x=>[x.data().date,x.data()]));let present=0,half=0,paidLeave=0,eligible=0;for(let n=1;n<=days;n++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;if(k>iso())continue;const r=rec[k],lv=leaves[k];if(lv?.status==="approved"){if(lv.type!=="Unpaid Leave")paidLeave++;continue}eligible++;if(r?.checkIn&&r?.checkOut)present++;else if(r?.checkIn)half++}const units=present+half*.5+paidLeave,percent=eligible?((present+half*.5)/eligible*100):0,pay=Math.round(Number(state.employee.salary||0)/30*units);$("empPanel").innerHTML=`<h3>Salary — ${y}-${String(m+1).padStart(2,"0")}</h3><div class="grid"><div class="card"><div class="muted">Monthly Salary</div><div class="stats">₹${Number(state.employee.salary||0).toLocaleString()}</div></div><div class="card"><div class="muted">Attendance</div><div class="stats">${percent.toFixed(1)}%</div></div><div class="card"><div class="muted">Estimated Payable</div><div class="stats">₹${pay.toLocaleString()}</div></div></div><p>Present: ${present} · Half day: ${half} · Paid leave: ${paidLeave}</p><p class="muted">Formula: monthly salary ÷ 30 × (present + 0.5×half-day + paid leave). This is an estimate; configure payroll rules as needed.</p>`}catch(e){alertErr(e)}};
window.empProfile=()=>{$("empPanel").innerHTML=`<h3>My Profile</h3><p><b>Name:</b> ${esc(state.employee.name)}</p><p><b>Employee ID:</b> ${esc(state.employee.employeeId)}</p><p><b>Email:</b> ${esc(state.employee.email)}</p><p><b>Position:</b> ${esc(state.employee.position)}</p><p><b>Salary:</b> ₹${Number(state.employee.salary||0).toLocaleString()}</p><p><b>DOB:</b> ${esc(state.employee.dob||"—")}</p><p><b>Joining:</b> ${esc(state.employee.joining||"—")}</p>`}
window.empAttendance=async()=>{
  let r={};try{const s=await getDoc(attendanceRef(state.user.uid,iso()));if(s.exists())r=s.data()}catch(_){}
  $("empPanel").innerHTML=`<h3>Today's Attendance — ${iso()}</h3><div class="grid">${attBox("in","Check In",r.checkInSelfie)}${attBox("out","Check Out",r.checkOutSelfie)}</div><p class="muted">GPS and camera require HTTPS (localhost is also allowed). Selfies are resized/compressed and stored one attendance document per day. Selfies older than 90 days are automatically removed when attendance history is opened; attendance times/records remain.</p>`
};
function attBox(type,title,photo){return `<div class="card"><b>${title}</b><div class="camera"><video id="v${type}" class="${photo?"hidden":""}" autoplay playsinline muted></video><img id="p${type}" class="photo ${photo?"":"hidden"}" src="${photo?esc(photo):""}"><span id="s${type}" class="${photo?"hidden":""}">Camera inactive</span></div><button class="secondary" onclick="openCam('${type}')">Open Camera</button><button onclick="saveAttendance('${type}')">Capture & Save</button></div>`}
window.openCam=async type=>{try{stopCamera();const v=$("v"+type);v.classList.remove("hidden");$("s"+type).classList.add("hidden");state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});v.srcObject=state.stream}catch(e){alert("Camera permission failed. Use HTTPS and allow camera access.")}}
async function getGPS(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error("Geolocation unavailable."));navigator.geolocation.getCurrentPosition(p=>resolve({lat:Number(p.coords.latitude.toFixed(6)),lng:Number(p.coords.longitude.toFixed(6)),accuracy:Math.round(p.coords.accuracy)}),e=>reject(Error("Location permission failed: "+e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0})})}
async function saveAttendance(type){
  try{
    if(!state.stream)return alert("Open camera first.");
    const v=$("v"+type),c=document.createElement("canvas"),srcW=v.videoWidth||640,srcH=v.videoHeight||480,maxW=640,w=Math.min(maxW,srcW),h=Math.round(srcH*w/srcW);
    c.width=w;c.height=h;c.getContext("2d").drawImage(v,0,0,w,h);
    let data=c.toDataURL("image/jpeg",.45);
    if(data.length>160000){data=c.toDataURL("image/jpeg",.32)}
    if(data.length>180000)throw Error("Selfie is still too large. Try again in better lighting.");
    const loc=await getGPS(),key=iso(),ref=attendanceRef(state.user.uid,key),snap=await getDoc(ref),old=snap.exists()?snap.data():{},now=Date.now();
    const patch=type==="in"?{checkIn:new Date(now).toLocaleTimeString(),checkInLocation:loc,checkInSelfie:data,checkInTimestamp:now}:{checkOut:new Date(now).toLocaleTimeString(),checkOutLocation:loc,checkOutSelfie:data,checkOutTimestamp:now};
    const merged={...old,...patch,uid:state.user.uid,employeeUid:state.user.uid,companyId:state.employee.companyId,date:key,updatedAt:serverTimestamp()};
    if(merged.checkInTimestamp&&merged.checkOutTimestamp)merged.hoursWorked=Number(((merged.checkOutTimestamp-merged.checkInTimestamp)/3600000).toFixed(2));
    await setDoc(ref,merged,{merge:true});
    stopCamera();await empAttendance();alert(titleCase(type)+" saved.");
  }catch(e){alertErr(e)}
}

function titleCase(x){return x[0].toUpperCase()+x.slice(1)}
window.empHistory=async()=>{
  $("empPanel").innerHTML=`<h3>Attendance Calendar</h3><div id="mycal"><p class="muted">Loading attendance…</p></div>`;
  try{const [snap,lsnap]=await Promise.all([getDocs(collection(db,"employees",state.user.uid,"attendance")),getDocs(collection(db,"employees",state.user.uid,"leaveRequests"))]);await purgeExpiredSelfies(state.user.uid,snap.docs);const records=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));const leaveMap=Object.fromEntries(lsnap.docs.filter(d=>d.data().status==="approved").map(d=>[d.data().date,d.data()]));await drawCalendar($("mycal"),state.employee,records,leaveMap)}catch(x){$("mycal").innerHTML=`<p class="error">${esc(x.message)}</p>`}
};
window.exportCSV=async()=>{
  try{const d=new Date(),y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate(),rows=[["Employee ID","Name","Position","Monthly Salary","Present Days","Half Days","Approved Paid Leave","Absent Days","Attendance %","Estimated Salary"]];
    for(const e of state.employees){const [snap,ls]=await Promise.all([getDocs(collection(db,"employees",e.id,"attendance")),getDocs(collection(db,"employees",e.id,"leaveRequests"))]);const records=Object.fromEntries(snap.docs.map(x=>[x.id,x.data()]));const leaves=Object.fromEntries(ls.docs.map(x=>[x.data().date,x.data()]));let p=0,h=0,paid=0,abs=0,eligible=0;for(let n=1;n<=days;n++){const k=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;if(k>iso())continue;const r=records[k],lv=leaves[k];if(lv?.status==="approved"){if(lv.type!=="Unpaid Leave")paid++;continue}eligible++;if(r?.checkIn&&r?.checkOut)p++;else if(r?.checkIn)h++;else abs++}const pct=eligible?((p+h*.5)/eligible*100):0,pay=Math.round(Number(e.salary||0)/30*(p+h*.5+paid));rows.push([e.employeeId,e.name,e.position,e.salary,p,h,paid,abs,pct.toFixed(1)+"%",pay])}
    const csv=rows.map(r=>r.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=`attendance_salary_${y}-${String(m+1).padStart(2,"0")}.csv`;a.click()
  }catch(x){alertErr(x)}
}

onAuthStateChanged(auth,async u=>{state.user=u;$("logout").classList.toggle("hidden",!u);if(!u){welcome();return}try{if(!u.emailVerified){await signOut(auth);welcome();return}let c=await getDoc(doc(db,"companies",u.uid));if(c.exists()){await ownerData();return}let e=await getDoc(doc(db,"employees",u.uid));if(e.exists()&&e.data().active!==false){state.employee={id:e.id,...e.data()};state.role="employee";await loadCompany(state.employee.companyId);employeeDash();return}await signOut(auth);throw Error("No active company or employee profile found.")}catch(e){alertErr(e);await signOut(auth);welcome()}})
</script>
</body>
